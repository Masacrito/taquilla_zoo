; Ajustes de PHP para el contenedor de la aplicación.

; El PDF del comprobante con dompdf es lo más pesado que corre aquí.
memory_limit = 256M
max_execution_time = 60

; La aplicación no recibe archivos del visitante.
upload_max_filesize = 8M
post_max_size = 8M

; Zona horaria: el aforo y los cortes se indexan por fecha. En UTC, una
; visita de la tarde caería en el día siguiente.
date.timezone = America/Mexico_City

; No anunciar la versión de PHP en las cabeceras.
expose_php = Off

; ── OPcache ─────────────────────────────────────────────────────────────
; El código no cambia dentro de la imagen, así que se apaga la revalidación
; por timestamp: menos syscalls por request.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; ── Errores ─────────────────────────────────────────────────────────────
; A stdout, para que los recoja el driver de logs de Docker. Nunca al
; navegador: una traza de Laravel enseña credenciales de la base.
log_errors = On
error_log = /dev/stderr
display_errors = Off
display_startup_errors = Off
