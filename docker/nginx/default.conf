server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;

    # El comprobante en PDF y las fotos no pasan de unos cientos de KB; no
    # hay subida de archivos en la aplicación.
    client_max_body_size 8M;

    # Cabeceras mínimas. HSTS NO va aquí: lo pone el proxy que termina TLS
    # delante de este contenedor, que es quien sabe si hay certificado.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear para
    # siempre porque un cambio genera un nombre nuevo.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # El webhook de pago genera el PDF y encola el correo; 60 s de sobra.
        fastcgi_read_timeout 60;
    }

    # Nada de puntos al inicio, salvo el well-known que usa Let's Encrypt.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
